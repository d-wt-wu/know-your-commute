# Mirrors the manually provisioned Free service. Editing this file alone does
# not update that service; releases and settings are applied deliberately.
services:
  - type: web
    name: know-your-commute
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: COMMUTE_REQUIRE_READONLY
        value: "1"
