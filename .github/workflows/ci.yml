name: Python and PostgreSQL checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-workflow:
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: "17.11"
            major: "17"
          - postgres: "18"
            major: "18"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-bookworm
        env:
          POSTGRES_USER: commute
          POSTGRES_PASSWORD: commute_ci
          POSTGRES_DB: commute_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commute -d commute_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://commute:commute_ci@127.0.0.1:5432/commute_test
      REQUIRE_INTEGRATION_TESTS: "1"
      BROWSER_TEST_DATABASE_URL: postgresql+psycopg://commute:commute_ci@127.0.0.1:5432/commute_browser_test
      PG_BIN: /usr/lib/postgresql/${{ matrix.major }}/bin
      POSTGRES_MAJOR: ${{ matrix.major }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: Matching PostgreSQL backup/restore client tools
        run: |
          if ! test -x "$PG_BIN/pg_dump"; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail --silent --show-error --location \
              --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc
            printf '%s\n' 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' \
              | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
            sudo apt-get update
            sudo apt-get install --yes "postgresql-client-$POSTGRES_MAJOR"
          fi
      - name: Unit and PostgreSQL integration checks (including migrations)
        run: uv run --locked pytest
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install and build dashboard
        run: |
          npm ci
          npm --prefix web ci
          npm run build
      - name: Seed isolated synthetic browser fixture
        run: uv run python scripts/seed_browser.py
      - name: Install browser for CI
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser journeys on desktop and mobile
        working-directory: web
        run: npm run test:e2e
      - name: Build deployment image
        run: docker build --tag know-your-commute:ci .
      - name: Verify the running container with isolated synthetic data
        run: |
          docker run --detach --name commute-container-check --network host \
            --env DATABASE_URL="$BROWSER_TEST_DATABASE_URL" --env PORT=8003 know-your-commute:ci
          trap 'docker rm --force commute-container-check' EXIT
          python - <<'PY'
          import time
          from urllib.request import urlopen
          for attempt in range(30):
              try:
                  with urlopen('http://127.0.0.1:8003/api/v1/ready', timeout=2) as response:
                      if response.status == 200:
                          break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Container did not become ready.')
          PY
          python scripts/check_deployment.py --base-url http://127.0.0.1:8003 --expected-records 35
