services:
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: commute
      POSTGRES_PASSWORD: commute_local
      POSTGRES_DB: commute
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - commute_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commute -d commute"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  commute_postgres:
